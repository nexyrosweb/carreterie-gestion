[package]
name = "carreterie-gestion"
version = "1.0.7"
description = "Carreterie Gestion - gestion hors ligne pour le Théâtre de la Carreterie"
authors = ["Nexyros"]
edition = "2021"

[lib]
name = "carreterie_gestion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
printpdf = { version = "0.7", features = ["embedded_images"] }
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
parking_lot = "0.12"
base64 = "0.22"
csv = "1"
pdf-extract = "0.7"
regex = "1"
unicode-normalization = "0.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
